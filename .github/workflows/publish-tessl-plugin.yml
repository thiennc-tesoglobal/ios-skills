name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate:
    name: Release Validation
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm

      - run: npm ci

      - name: Validate repository
        run: |
          python3 .github/scripts/validate_repository.py --release
          python3 -m unittest discover -s tests -v
          npm test
          npm run pack:check
          python3 .github/scripts/validate_public_discovery.py --run

      - name: Check release versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          marketplace_version="$(jq -r '.metadata.version' .claude-plugin/marketplace.json)"
          tessl_version="$(jq -r '.version' .tessl-plugin/plugin.json)"
          npm_version="$(jq -r '.version' package.json)"

          if [[ "$marketplace_version" != "$tessl_version" || "$marketplace_version" != "$npm_version" ]]; then
            echo "Version mismatch: marketplace=$marketplace_version tessl=$tessl_version npm=$npm_version" >&2
            exit 1
          fi

          if jq -e --arg version "$marketplace_version" \
            'any(.plugins[]; .version != $version)' \
            .claude-plugin/marketplace.json > /dev/null; then
            echo "One or more Claude bundles do not match version $marketplace_version" >&2
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$marketplace_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version v$marketplace_version" >&2
            exit 1
          fi

  publish:
    name: Publish Tessl Plugin
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Publish Tessl plugin
        run: |
          set -euo pipefail
          plugin="$(jq -r '.name' .tessl-plugin/plugin.json)"
          version="$(jq -r '.version' .tessl-plugin/plugin.json)"

          if tessl plugin publish .; then
            exit 0
          fi

          echo "::warning::Publish command failed; checking whether ${plugin}@${version} exists in the registry."
          tessl plugin info "${plugin}@${version}"

  github-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Swift iOS Skills Community $RELEASE_TAG" \
              --generate-notes
          fi
